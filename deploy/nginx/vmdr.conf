# Native deployment: serves the built frontend and proxies /api to the systemd API on 127.0.0.1:8000.
# Build the UI first: (cd frontend && npm ci && npm run build), then copy frontend/dist to /opt/vmdr/frontend/dist.
server {
    listen 80;
    server_name vmdr.example.internal;

    root /opt/vmdr/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
