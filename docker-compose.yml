# VMDR stack. All settings live in .env (copy .env.example to .env).
# Start: docker compose up -d --build
name: vmdr

services:
  web-api:
    build:
      context: ./backend
      args: {NUCLEI_VERSION: "${NUCLEI_VERSION}"}
    image: vmdr-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    env_file: .env
    volumes:
      - vmdr-data:/data
    networks: [vmdr-edge, vmdr-egress]
    deploy:
      resources:
        limits: {cpus: "${API_CPUS}", memory: "${API_MEMORY}", pids: "${API_PIDS}"}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scanner-worker:
    build:
      context: ./backend
      args: {NUCLEI_VERSION: "${NUCLEI_VERSION}"}
    image: vmdr-backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    volumes:
      - vmdr-data:/data
      - vmdr-nuclei-templates:/home/vmdr/nuclei-templates
    networks: [vmdr-egress]
    depends_on:
      web-api:
        condition: service_healthy
    stop_grace_period: 60s
    deploy:
      resources:
        limits: {cpus: "${WORKER_CPUS}", memory: "${WORKER_MEMORY}", pids: "${WORKER_PIDS}"}
    restart: unless-stopped

  web-frontend:
    build: ./frontend
    ports:
      - "${HTTP_PORT}:80"
    networks: [vmdr-edge]
    depends_on: [web-api]
    deploy:
      resources:
        limits: {cpus: "${FRONTEND_CPUS}", memory: "${FRONTEND_MEMORY}", pids: "${FRONTEND_PIDS}"}
    restart: unless-stopped

# Networks (separate on purpose):
#   vmdr-edge    frontend <-> web-api only. The browser-facing side; the worker is not on it.
#   vmdr-egress  web-api and scanner-worker. The worker needs outbound access to scan targets.
#                The frontend is not on it, so it cannot reach the worker or the internet.
networks:
  vmdr-edge:
    name: vmdr-edge
  vmdr-egress:
    name: vmdr-egress

# Volumes (separate on purpose):
#   vmdr-data                  SQLite database and scan output. Shared by web-api and scanner-worker.
#   vmdr-nuclei-templates      Nuclei template cache. Only scanner-worker mounts it.
volumes:
  vmdr-data:
    name: vmdr-data
  vmdr-nuclei-templates:
    name: vmdr-nuclei-templates
