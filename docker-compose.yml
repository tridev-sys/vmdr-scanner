# VMDR: scanner-worker, web-api, web-frontend.
# Requires a Linux Docker host (the Nuclei binary is mounted from the host, so it must be a Linux build).
# Configure via ./.env (see .env.example). Start with: docker compose up -d --build
name: vmdr

x-backend-build: &backend-build
  build:
    context: ./backend
  image: vmdr-backend:latest

x-backend-env: &backend-env
  VMDR_DATABASE_URL: sqlite:////data/vmdr.db
  VMDR_SCAN_WORKDIR: /data/scans
  VMDR_API_KEY: ${VMDR_API_KEY:-}
  VMDR_CORS_ORIGINS: ${VMDR_CORS_ORIGINS:-http://localhost:8080}
  VMDR_NUCLEI_BIN: /usr/local/bin/nuclei
  VMDR_NUCLEI_RATE_LIMIT: ${VMDR_NUCLEI_RATE_LIMIT:-50}
  VMDR_NUCLEI_CONCURRENCY: ${VMDR_NUCLEI_CONCURRENCY:-10}
  VMDR_NUCLEI_RETRIES: ${VMDR_NUCLEI_RETRIES:-1}
  VMDR_NUCLEI_TIMEOUT: ${VMDR_NUCLEI_TIMEOUT:-5}
  VMDR_NUCLEI_SEVERITIES: ${VMDR_NUCLEI_SEVERITIES:-critical,high,medium}
  VMDR_FULL_SCAN_CRON: ${VMDR_FULL_SCAN_CRON:-0 2 * * *}
  VMDR_TEMPLATE_UPDATE_HOURS: ${VMDR_TEMPLATE_UPDATE_HOURS:-24}
  VMDR_RESOLVE_AFTER_MISSES: ${VMDR_RESOLVE_AFTER_MISSES:-2}

services:
  web-api:
    <<: *backend-build
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment: *backend-env
    volumes:
      - vmdr-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${VMDR_API_CPUS:-1.0}"
          memory: ${VMDR_API_MEMORY:-512M}
          pids: 200
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scanner-worker:
    <<: *backend-build
    depends_on:
      web-api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
    volumes:
      - vmdr-data:/data
      # Host Nuclei binary, read-only.
      - ${NUCLEI_BIN:-/usr/local/bin/nuclei}:/usr/local/bin/nuclei:ro
      # Host template cache so `nuclei -update-templates` results persist and are shared.
      - ${NUCLEI_TEMPLATES_DIR:-/root/nuclei-templates}:/home/vmdr/nuclei-templates
    stop_grace_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${VMDR_WORKER_CPUS:-2.0}"
          memory: ${VMDR_WORKER_MEMORY:-2G}
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 512M

  web-frontend:
    build:
      context: ./frontend
    depends_on:
      - web-api
    ports:
      - "${VMDR_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${VMDR_FRONTEND_CPUS:-0.5}"
          memory: ${VMDR_FRONTEND_MEMORY:-128M}
          pids: 100
        reservations:
          cpus: "0.1"
          memory: 32M

volumes:
  vmdr-data:
